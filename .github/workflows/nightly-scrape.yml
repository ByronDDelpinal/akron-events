# Nightly scrape — runs every active scraper in scripts/manifest.js against
# production. (Not a fixed number — no test enforces a scraper count, and the
# manifest grows over time. Check scripts/manifest.js for the current count.)
#
# This is the external runner the scrape pipeline has always needed. Scraping
# every active source takes far longer than an agent session or a serverless
# function will allow, so it lives here: an Actions job with a 150-minute
# budget, no laptop required.
#
# What it does, in order:
#   1. run-all.js         — every scraper in scripts/manifest.js, sequentially,
#                            then dedupe-cross-source.js --apply (unless
#                            skip_dedupe / --no-dedupe), then a Vercel
#                            edge-cache purge of the shared `events` tag.
#                            Writes scrape-reports/run.json (the plan, then the
#                            outcome) both before and after the run, so
#                            scrape-report.js can tell a filtered (--key /
#                            --group) run from a full-corpus one instead of
#                            misreading unrelated pre-existing failures as
#                            something this run broke. Exits 1 only when
#                            scraper failures exceed 15% of the plan (~137
#                            active scrapers hitting independent third-party
#                            sources nightly — some transient churn is
#                            expected and normal) or dedupe-cross-source.js
#                            itself fails, which is always red regardless of
#                            the threshold.
#   2. geocode-venues.js  — backfills lat/lng for venues the run just created
#                            that don't have coordinates yet. Best-effort
#                            (continue-on-error) — a geocoding hiccup must
#                            never redden an otherwise-healthy scrape.
#   3. scrape-report.js   — writes scrape-reports/ (health per source). Reads
#                            run.json (when fresh — see
#                            RUN_CONTEXT_MAX_AGE_HOURS) to scope its census to
#                            what this run actually planned, rather than
#                            grading every active source against a run that
#                            may have only covered one --key/--group.
#
# Deliberately NOT `npm run scrape:all`. Locally that script is now
# `run-all.js; s=$?; scrape-report.js; exit $s` so a failed scrape still
# turns the local run red — but here they're kept as separate steps anyway,
# because the report step needs `if: always()` to run when the scrape step
# itself hard-fails (e.g. before scrape-report.js would ever get a chance to
# run), and a partial run is exactly when the health report matters most.
#
# TIMEZONE — the one that will bite you. Actions runners are UTC. This
# codebase has a documented class of bug where a local `Date` + `toISOString()`
# lands an event on the wrong day, and several scrapers parse wall-clock
# strings with no zone. `TZ: America/New_York` at the job level makes the
# runner behave like the machine these scrapers were written and tested on.
# Do not remove it.
#
# SCHEDULE — enabled. Measured 2026-07-27, production run #3
# (workflow_dispatch, full corpus, commit 195d867): 139 sources logged to
# scraper_runs, 73.6 minutes of wall-clock span from first to last scraper
# log, 9 failures (the 15%-of-plan threshold is ~20, so the job was green),
# 256 events inserted, 3,645 updated.
#
# Why `0 2 * * *` (02:00 UTC = 10pm EDT / 9pm EST). Note this fires on UTC
# day D but is the ET evening of D-1.
#
# Byron reevaluated the whole nightly chain against one hard constraint:
# everything user-facing — specifically the digest email — must be built
# and sent by 6:30am ET, so early risers planning their day get fresh data.
# The scrape moved from 11pm to 10pm to buy the runway the rest of the
# chain needs to clear that deadline. The freshness cost of the earlier
# start is small: by 10pm almost all of that day's events have already
# started, so little is actually lost by scraping an hour sooner.
#
# 8pm–midnight ET is the window where a `new Date().toISOString()`-derived
# "today" has already rolled to tomorrow's UTC date, silently dropping (or
# mis-dating by a year) the rest of today's events. 10pm sits inside that
# window exactly as 11pm did — this is not a new risk relative to the
# previous hour, and the margin is unchanged: zero. The only thing that
# makes this hour safe is that the six affected scrapers were migrated to
# `easternTodayIso()` (scripts/lib/normalize.js:476-489), and
# scripts/tests/test-no-utc-today.js fails the build if the shape
# reappears. That guard is now load-bearing for the schedule itself — do
# not weaken it or blanket-allowlist it, on this hour or any other inside
# the 8pm–midnight window.
#
# DST: cron is fixed UTC, so exactly one phase can be hit on the nose.
# Eight months of the year this is 10pm ET (EDT); four months it is 9pm ET
# (EST). The drift is one hour and it drifts EARLIER, which is the safe
# direction — further from midnight, more runway for everything
# downstream. Firing on UTC day D is still the ET evening of D-1 in both
# phases.
#
# `0 4 * * *` was rejected: it would start the job at midnight ET for eight
# months, so a ~80-minute run would straddle the ET day boundary and the
# first and last scrapers of the same job would disagree about what "today"
# is — trading one day-boundary bug for another.
#
# Downstream chain this now feeds (all ET; these are the *scheduled* times
# — Cowork adds up to ~9 minutes of dispatch jitter on top of each):
#
#   10:00pm  this workflow                                     150 min budget
#   12:45am  process-intake-emails                               30 min budget
#    1:30am  nightly-data-pipeline                              120 min budget
#    3:45am  daily-data-fix-sweep                                45 min budget
#    4:45am  nightly-qa-pipeline (reports ~40 min in; its       40 + 120 min
#             fix chain runs past the deadline by design)
#    5:45am  morning-briefing → posts to #daily-reports          15 min budget
#    6:00am  send-daily-digest (pg_cron jobid 1, now `0 10 * * *` UTC)
#
# Ordering principle: the data work — scrape, data pipeline, fix sweep — all
# precedes the digest, so subscribers get mail built from data that has
# already been cleaned. QA's code-fix chain is internal (it commits to
# agents/nightly for the maintainer to review, never to main), so it
# deliberately runs last and is allowed to overrun the 6:30am deadline.
#
# These are absolute cron/task times, not dependencies: Cowork cannot chain
# a task off another task's completion, so a stage that overruns causes
# overlap with the next stage rather than delaying it. The gaps between
# stages above are the only protection against that overlap, which is why
# moving any one of these times requires re-checking the others.
#
#   schedule:
#     - cron: '0 2 * * *'   # 10pm EDT / 9pm EST — see rationale above.
#
# Timeout: 73.6 measured minutes of scraper time, plus setup, the Chrome
# install, dedupe, geocode and the report, lands close to 80 minutes total.
# The 150-minute cap below is ~2x that measured total (the old 120-minute cap,
# set before any full run had been measured, was only ~1.5x) — enough
# headroom for a slow-runner night or manifest growth without a mid-run kill.
# A timeout kill is expensive here specifically because of where it lands: it
# happens after an unknown number of scrapers have already written to the DB
# and before dedupe-cross-source.js and scrape-report.js get to run, i.e. the
# worst place to lose the job — partial writes with no cleanup pass and no
# health report.
#
# `workflow_dispatch` (below) remains available alongside the schedule, with
# its `group` / `key` / `dry_run` / `skip_dedupe` inputs, for targeted
# re-runs (e.g. one failed source) without waiting for the next scheduled run.
#
# Two reasons a `schedule:` trigger is not "set it and forget it": GitHub
# Actions defers (delays or drops) scheduled runs under platform load, and
# GitHub disables `schedule` triggers automatically after 60 days of
# repository inactivity (no pushes/merges) — both are worth an occasional
# manual check that the schedule actually fired.
#
# Chrome: 10 scrapers use Puppeteer, so unlike ci.yml this workflow cannot
# skip the browser. `npm ci --ignore-scripts` keeps the postinstall from
# downloading Chrome on every run; the explicit install step below is cached.
# That step deliberately carries NO secrets — it executes third-party
# (puppeteer) package code, and job-level secrets would otherwise leak into
# that code's environment for no reason.
#
# Permissions are read-only and there are no git writes. Nothing here commits,
# branches, or pushes — the maintainer owns version control.

name: Nightly scrape

on:
  schedule:
    # 10pm EDT / 9pm EST — see the SCHEDULE block in the header comment
    # above for the full rationale (DST drift, why not 04:00 UTC, and the
    # easternTodayIso invariant that makes this hour safe).
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: 'Run one manifest group only (e.g. civicplus, ics, wordpress). Blank = all.'
        required: false
        type: string
      key:
        description: 'Run one scraper by key (e.g. blu_jazz). Blank = all. Overrides group.'
        required: false
        type: string
      dry_run:
        description: 'Print the run plan and exit without touching the database.'
        required: false
        type: boolean
        default: false
      skip_dedupe:
        description: 'Skip cross-source dedupe --apply after scraping (passes --no-dedupe to run-all.js).'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One scrape at a time, ever. Two concurrent runs would race each other
# through dedupe-cross-source --apply against the same rows.
concurrency:
  group: nightly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape all sources
    runs-on: ubuntu-latest
    # ~2x the measured full-run total (~80 min: 73.6 min of scraper time plus
    # setup/Chrome/dedupe/geocode/report) — see the SCHEDULE block in the
    # header comment above for why a timeout kill is worse here than in most
    # workflows (it lands mid-write, before dedupe and the report run).
    timeout-minutes: 150

    # Only the timezone lives at job level. Everything else is scoped to the
    # individual steps that need it — see the Chrome-install note above for
    # why: `npx puppeteer browsers install chrome` runs third-party package
    # code, and job-level env would hand it SUPABASE_SERVICE_ROLE_KEY and
    # every other secret for no reason.
    env:
      TZ: America/New_York

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Cached separately from node_modules: the Chrome download is ~150MB and
      # changes far less often than the lockfile.
      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: puppeteer-${{ runner.os }}-

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Verify required secrets are present
        env:
          VITE_SUPABASE_URL:         ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          [ -n "$VITE_SUPABASE_URL" ]         || missing+=("VITE_SUPABASE_URL")
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing+=("SUPABASE_SERVICE_ROLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Required secrets present. Runner timezone: $(date +'%Z %z')"

      - name: Run all scrapers
        id: scrape
        env:
          IN_DRY_RUN:     ${{ inputs.dry_run }}
          IN_KEY:         ${{ inputs.key }}
          IN_GROUP:       ${{ inputs.group }}
          IN_SKIP_DEDUPE: ${{ inputs.skip_dedupe }}

          # Core — without these nothing writes.
          VITE_SUPABASE_URL:         ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # Source APIs.
          EVENTBRITE_API_KEY:   ${{ secrets.EVENTBRITE_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          DICE_API_KEY:         ${{ secrets.DICE_API_KEY }}

          # Residential proxy (DataImpulse, 5 GB budget) for the handful of
          # scrapers that opt in via useProxy — CF-challenged sources only.
          # Absent = every scraper egresses direct, exactly as before.
          SCRAPER_PROXY_URL: ${{ secrets.SCRAPER_PROXY_URL }}

          # Content moderation blocklist (base64). Absent = no blocklist applied.
          MODERATION_TERMS_B64: ${{ secrets.MODERATION_TERMS_B64 }}

          # Edge-cache purge after a successful run. Optional — run-all skips the
          # purge with a log line when these are unset, and the cache self-heals
          # via TTL, so a missing token never fails the run.
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID:    ${{ secrets.VERCEL_TEAM_ID }}

          # Optional direct ICS feed URLs. Every scraper here falls back to
          # discovery or a hardcoded default when its var is unset EXCEPT
          # AKRON_PUBLIC_SCHOOLS_ICS_URL — that one has no hardcoded fallback
          # (scripts/scrape-akron-public-schools.js:88-106 throws when
          # discovery fails), so it genuinely needs its secret set.
          AKRON_POWER_SQUADRON_ICS_URL: ${{ secrets.AKRON_POWER_SQUADRON_ICS_URL }}
          AKRON_PUBLIC_SCHOOLS_ICS_URL: ${{ secrets.AKRON_PUBLIC_SCHOOLS_ICS_URL }}
          AKRON_SYMPHONY_ICS_URL:       ${{ secrets.AKRON_SYMPHONY_ICS_URL }}
          CITY_OF_GREEN_ICS_URL:        ${{ secrets.CITY_OF_GREEN_ICS_URL }}
          FULL_GRIP_GAMES_ICS_URL:      ${{ secrets.FULL_GRIP_GAMES_ICS_URL }}
          LIFE_GURUKULA_ICS_URL:        ${{ secrets.LIFE_GURUKULA_ICS_URL }}
          NORTH_HILL_CDC_ICS_URL:       ${{ secrets.NORTH_HILL_CDC_ICS_URL }}
          PENINSULA_ART_ACADEMY_ICS_URL: ${{ secrets.PENINSULA_ART_ACADEMY_ICS_URL }}

          # dedupe-cross-source.js --apply safety cap. The computed default is
          # max(50, ceil(2% of loaded events)) — with ~7932 events that's 159,
          # against an observed steady state of 6 deletes/night. ~26x headroom
          # is too loose to catch a matching-logic bug before it mass-deletes;
          # 40 still gives ~6-7x headroom over the steady state while forcing
          # a manual --max-deletes review if a bad change spikes the count.
          DEDUPE_MAX_DELETES: 40
        # Inputs are passed through env (not interpolated into the script body)
        # and assembled into a quoted bash array — direct `${{ inputs.* }}`
        # interpolation into `run:` is the most-flagged Actions anti-pattern
        # (script injection via a crafted input), and unquoted `$args`
        # word-splitting breaks on any value containing whitespace.
        run: |
          args=()
          [ "$IN_DRY_RUN" = "true" ] && args+=(--dry-run)
          if   [ -n "$IN_KEY" ];   then args+=(--key "$IN_KEY")
          elif [ -n "$IN_GROUP" ]; then args+=(--group "$IN_GROUP"); fi
          [ "$IN_SKIP_DEDUPE" = "true" ] && args+=(--no-dedupe)
          echo "run-all.js ${args[*]}"
          node scripts/run-all.js "${args[@]}"

      # Best-effort venue geocoding backfill. New venues appear every run;
      # unmapped venues degrade the map view and neighborhood hubs, but a
      # geocoding failure (rate limit, bad token, network blip) must never
      # redden an otherwise-healthy scrape — hence continue-on-error. A
      # nonzero exit under continue-on-error otherwise vanishes with no
      # trace, so a failure is also mirrored to the job summary — loud
      # enough to catch a Nominatim policy block without failing the run.
      - name: Geocode venues
        if: always() && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          VITE_SUPABASE_URL:         ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run geocode:venues || { echo "🚨 geocode-venues FAILED (possible Nominatim policy block)" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

      # Runs even when the scrape step failed — a partial run is when the
      # health report matters most.
      - name: Generate scrape report
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          VITE_SUPABASE_URL:         ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-report.js

      # scrape-reports/ is gitignored (regenerated every run), so the artifact
      # is how the report — and the dedupe deletion audit trail written
      # alongside it — leaves the runner.
      - name: Upload scrape report
        if: always() && github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scrape-report-${{ github.run_number }}
          path: scrape-reports/
          retention-days: 30
          if-no-files-found: warn

      # Puts the report on the run's summary page, so a red run can be
      # triaged from a phone without downloading anything.
      - name: Publish report to job summary
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          if [ -f scrape-reports/latest.md ]; then
            cat scrape-reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No scrape report was generated — the run failed early." >> "$GITHUB_STEP_SUMMARY"
          fi
